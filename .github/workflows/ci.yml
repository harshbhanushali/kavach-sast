name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Typecheck the console
        run: npm run typecheck
      - name: Build the console
        run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kavach-sast:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts, is healthy, and runs as production
        run: |
          docker run -d --name sast -p 8788:8788 \
            -e KAVACH_SAST_ADMIN_PASSWORD=ci-test-password-1 kavach-sast:ci
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' sast)" = healthy ] && break
            sleep 3
          done
          docker logs sast
          test "$(docker inspect -f '{{.State.Health.Status}}' sast)" = healthy
          # production: the published default (a password was set above, so it is not active), no development token
          curl -fsS http://127.0.0.1:8788/v1/auth/info | grep -q '"defaultAccounts":\[\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'authorization: Bearer dev-user-token' http://127.0.0.1:8788/v1/sast/scans)" = 401
          # the tools a scan needs are really in the image
          docker exec sast sh -c 'apktool version && jadx --version && apksigner --version && qpdf --version | head -1'
          docker exec sast npm run doctor
      - name: Stops cleanly on SIGTERM
        run: |
          docker stop -t 30 sast
          test "$(docker inspect -f '{{.State.ExitCode}}' sast)" = 0

  installer:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'ubuntu:24.04', 'fedora:latest']
    container: ${{ matrix.image }}
    steps:
      # The container images are minimal; the installer fetches what it needs after these two.
      - name: Prerequisites for checkout
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq git ca-certificates curl; else dnf install -y -q git; fi
      - uses: actions/checkout@v4
      - name: Install with scripts/install-linux.sh (no systemd in a container)
        run: ./scripts/install-linux.sh --yes --accept-android-sdk-license --no-service --admin-password ci-test-password-1
      - name: The installed server starts and is healthy
        run: |
          (runuser -u kavach -- kavach-sast > /tmp/server.log 2>&1 &)
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8788/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8788/healthz | grep -q '"ok":true' || { cat /tmp/server.log; exit 1; }
          curl -fsS http://127.0.0.1:8788/v1/auth/info | grep -q '"defaultAccounts":\[\]'
      - name: Uninstall
        run: ./scripts/install-linux.sh --yes --uninstall --purge

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh
